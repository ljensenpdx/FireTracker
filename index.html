<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oregon Command Dashboard</title>
    <style>
        body {
            background-color: #050505;
            color: #eee;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            display: grid;
            grid-template-columns: 240px 1fr 350px;
            grid-template-rows: 60px 1fr 300px;
            gap: 10px;
            height: 98vh;
        }

        header { grid-column: 1 / -1; border-bottom: 2px solid #ff3b30; display: flex; justify-content: space-between; align-items: center; }
        
        .panel { background: #111; border: 1px solid #333; display: flex; flex-direction: column; }
        .panel-header { background: #1a1a1a; padding: 8px; font-weight: bold; color: #ff3b30; border-bottom: 1px solid #333; text-transform: uppercase; font-size: 0.8rem; }

        /* Left Sidebar: Unit Selectors */
        .sidebar-left { grid-row: 2 / 4; }
        .btn { background: #222; color: #fff; border: 1px solid #444; padding: 12px; margin: 5px 10px; text-align: left; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

        /* Center: Map Area */
        .center-map { grid-column: 2; grid-row: 2 / 4; }

        /* Lower Right: Live Regional Feed */
        #regional-feed { grid-column: 3; grid-row: 3; }
        .feed-container { flex: 1; overflow-y: auto; padding: 10px; background: #000; font-family: 'Consolas', monospace; }

        /* Grouped Data Formatting */
        .inc-block { margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .inc-type { color: #ff3b30; font-weight: bold; font-size: 13px; }
        .inc-addr { color: #fff; font-size: 13px; margin: 2px 0; }
        .unit-group { margin-top: 4px; line-height: 1.4; }
        .unit-ids { color: #00ff41; font-weight: bold; font-size: 12px; }
        .status-tag { color: #777; font-size: 11px; margin-left: 4px; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0;">OREGON <span style="color:#ff3b30;">COMMAND</span></h1>
        <div id="clock" style="color:#00ff41; font-family:monospace; font-size:1.2rem;">--:--:-- PST</div>
    </header>

    <div class="panel sidebar-left">
        <div class="panel-header">Unit Selectors</div>
        <button class="btn">TONED OUT</button>
        <button class="btn">EN ROUTE</button>
        <button class="btn">ON SCENE</button>
        <button class="btn">TO HOSPITAL</button>
        <button class="btn">AT HOSPITAL</button>
        <button class="btn">CLEARED</button>
    </div>

    <div class="panel center-map">
        <div class="panel-header">Tactical Map View</div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#333;">[ MAP INTERFACE ]</div>
    </div>

    <div class="panel">
        <div class="panel-header">Agency Selectors</div>
        <div style="padding:5px; display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <button class="btn" style="margin:0;">CLACKAMAS</button>
            <button class="btn" style="margin:0;">MARION</button>
        </div>
    </div>

    <div class="panel" id="regional-feed">
        <div class="panel-header">Live Regional Feed</div>
        <div class="feed-container" id="feed-items">
            <div style="color:#00ff41;">SYNCING...</div>
        </div>
    </div>

    <script>
        // Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString() + ' PST';
        }, 1000);

        // Grouped PulsePoint Logic
        async function updateFeed() {
            const feed = document.getElementById('feed-items');
            try {
                const res = await fetch('data.json?t=' + Date.now());
                const data = await res.json();

                if (!data.length) {
                    feed.innerHTML = '<div style="color:#444;">NO ACTIVE INCIDENTS</div>';
                    return;
                }

                feed.innerHTML = data.map(inc => {
                    // Group IDs by status
                    const groups = {};
                    inc.unitStatuses.forEach(u => {
                        const parts = u.match(/(.+) \((.+)\)/);
                        if (parts) {
                            const [_, id, status] = parts;
                            if (!groups[status]) groups[status] = [];
                            groups[status].push(id);
                        }
                    });

                    // Format: ID, ID (Status)
                    const statusRows = Object.keys(groups).map(s => `
                        <div class="unit-group">
                            <span class="unit-ids">${groups[s].join(', ')}</span>
                            <span class="status-tag">(${s})</span>
                        </div>
                    `).join('');

                    return `
                        <div class="inc-block">
                            <div class="inc-type">${inc.type}</div>
                            <div class="inc-addr">${inc.address}</div>
                            ${statusRows}
                            <div style="color:#444; font-size:10px; margin-top:3px;">${inc.agency} • ${inc.time}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error("Sync error"); }
        }

        setInterval(updateFeed, 30000);
        updateFeed();
    </script>
</body>
</html>
