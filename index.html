<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oregon Command Dashboard</title>
    <style>
        /* Keeping your original dashboard styling */
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            height: 98vh;
            display: grid;
            grid-template-columns: 250px 1fr 450px;
            grid-template-rows: auto 1fr;
            gap: 15px;
        }

        .header-bar {
            grid-column: 1 / -1;
            border-bottom: 2px solid #ff3b30;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background-color: #1a1a1a;
            padding: 10px;
            font-weight: bold;
            color: #ff3b30;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        /* 📡 THE FEED CONTAINER (Where PulsePoint used to be) */
        .live-regional-feed-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #000;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        /* Incident Row Styling */
        .incident-entry {
            margin-bottom: 18px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .incident-type {
            color: #ff3b30;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }

        .incident-addr {
            color: #fff;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .unit-group {
            margin-top: 5px;
            line-height: 1.5;
        }

        .unit-ids {
            color: #00ff41; /* Terminal Green */
            font-weight: bold;
        }

        .unit-status {
            color: #888;
            font-size: 12px;
            margin-left: 4px;
        }

        .incident-meta {
            color: #555;
            font-size: 11px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1 style="margin:0;">OREGON <span style="color:#ff3b30;">COMMAND</span></h1>
        <div id="clock" style="color:#00ff41; font-family:monospace; font-size:1.2rem;">--:--:-- PST</div>
    </div>

    <div class="panel">
        <div class="panel-header">Agency Selectors</div>
        <div style="padding:10px; display:flex; flex-direction:column; gap:8px;">
            <button style="background:#222; color:white; border:1px solid #444; padding:8px; text-align:left;">CLACKAMAS</button>
            <button style="background:#222; color:white; border:1px solid #444; padding:8px; text-align:left;">MARION</button>
            <button style="background:#222; color:white; border:1px solid #444; padding:8px; text-align:left;">MULTNOMAH</button>
        </div>
    </div>

    <div class="panel" style="grid-column: 2 / 4;">
        <div class="panel-header">Live Regional Feed</div>
        <div class="live-regional-feed-content" id="feed-display">
            <div style="color: #00ff41;">ESTABLISHING UPLINK TO DATA.JSON...</div>
        </div>
    </div>

    <script>
        // 1. Clock Logic
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString() + ' PST';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. The Grouped Feed Logic
        async function fetchPulseData() {
            const container = document.getElementById('feed-display');
            
            try {
                // Fetch your scraped data.json
                const response = await fetch('data.json?t=' + Date.now());
                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="color:#444;">[ STANDBY ] NO ACTIVE INCIDENTS</div>';
                    return;
                }

                container.innerHTML = data.map(incident => {
                    // --- GROUPING LOGIC ---
                    // Creates an object: { "On Scene": ["E35", "T56"], "En Route": ["AMR113"] }
                    const groups = {};
                    incident.unitStatuses.forEach(u => {
                        const match = u.match(/(.+) \((.+)\)/);
                        if (match) {
                            const [_, id, status] = match;
                            if (!groups[status]) groups[status] = [];
                            groups[status].push(id);
                        }
                    });

                    // Convert groups into: "ID, ID (Status)"
                    const statusLines = Object.keys(groups).map(status => {
                        return `
                            <div class="unit-group">
                                <span class="unit-ids">${groups[status].join(', ')}</span>
                                <span class="unit-status">(${status})</span>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="incident-entry">
                            <div class="incident-type">${incident.type}</div>
                            <div class="incident-addr">${incident.address}</div>
                            <div class="status-rows">
                                ${statusLines || '<div style="color:#333;">PENDING UNIT ASSIGNMENT</div>'}
                            </div>
                            <div class="incident-meta">
                                ${incident.agency} | DISPATCHED: ${incident.time}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                container.innerHTML = '<div style="color:#ff3b30;">[!] OFFLINE: DATA.JSON SYNC FAILED</div>';
            }
        }

        // Refresh every 30 seconds
        setInterval(fetchPulseData, 30000);
        fetchPulseData();
    </script>
</body>
</html>
