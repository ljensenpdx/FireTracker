<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oregon Fire Ops | Command Dashboard</title>
    <style>
        :root {
            --bg-dark: #080808; --panel-bg: #121212; --fire-red: #cc3333; 
            --directory-yellow: #ffff00; --timestamp-cyan: #00f2ff;
            --terminal-green: #00ff00;
        }

        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg-dark); color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #000; padding: 12px 25px; border-bottom: 3px solid var(--fire-red); display: flex; justify-content: space-between; align-items: center; }

        .main-wrapper { display: grid; grid-template-columns: 1fr 450px; gap: 12px; padding: 12px; flex-grow: 1; overflow: hidden; }

        /* THE LIVE FEED BOX */
        .terminal-panel { display: flex; flex-direction: column; background: #000; border: 1px solid #333; border-radius: 6px; overflow: hidden; height: 100%; }
        .terminal-header { background: #111; padding: 8px 15px; border-bottom: 1px solid #333; font-size: 0.75rem; font-weight: bold; color: #aaa; display: flex; justify-content: space-between; }
        
        .live-feed-container { flex-grow: 1; background: #000; overflow-y: auto; padding: 20px; font-family: 'Courier New', monospace; }

        /* GREEN COMPUTER TEXT STYLING */
        .incident-entry { border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; border-left: 3px solid var(--fire-red); padding-left: 15px; }
        .inc-agency { color: var(--terminal-green); font-weight: 900; font-size: 0.8rem; letter-spacing: 1px; }
        .inc-type { color: #fff; font-size: 1.2rem; font-weight: bold; margin: 2px 0; }
        .inc-addr { color: var(--directory-yellow); font-size: 0.85rem; }
        
        .status-row { margin-left: 15px; font-weight: bold; font-size: 1.1rem; }
        .scne-text { color: #ff3333; text-shadow: 0 0 5px #ff3333; } /* On Scene - Red */
        .hosp-text { color: #ffff00; text-shadow: 0 0 5px #ffff00; } /* To Hospital - Yellow */
        .enrt-text { color: #33ff33; } /* En Route - Green */

        /* CONFIG INPUT BOX */
        .config-bar { background: #111; padding: 10px; border-top: 1px solid #333; display: flex; gap: 10px; }
        .config-input { background: #000; border: 1px solid #444; color: var(--timestamp-cyan); padding: 8px; flex-grow: 1; font-family: monospace; font-size: 0.8rem; outline: none; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 1.2rem;">OREGON <span style="color:var(--fire-red)">COMMAND DASHBOARD</span></div>
    <div id="clock" style="font-family: monospace; font-size: 1.4rem; font-weight: 900;">00:00:00</div>
</header>

<div class="main-wrapper">
    <div class="column" style="background:var(--panel-bg); border-radius:6px; border:1px solid #222;">
        <div style="padding:20px; text-align:center; opacity:0.3;">[ INCIDENT UNIT CARDS WILL LOAD HERE ]</div>
    </div>

    <div class="terminal-panel">
        <div class="terminal-header">
            <span>LIVE INTELLIGENCE FEED</span>
            <span id="sync-indicator" style="color:var(--timestamp-cyan);">STANDBY</span>
        </div>
        
        <div class="live-feed-container" id="feed-root">
            [ INITIALIZING FREQUENCIES... ]
        </div>

        <div class="config-bar">
            <input type="text" id="bridge-url" class="config-input" 
                   placeholder="PASTE PINGGY URL HERE" 
                   value="https://hzgca-204-195-74-174.a.free.pinggy.link/incidents">
        </div>
    </div>
</div>

<script>
    async function updateLiveFeed() {
        let url = document.getElementById('bridge-url').value.trim();
        const feedRoot = document.getElementById('feed-root');
        const syncText = document.getElementById('sync-indicator');

        // Auto-fix: Ensure the URL ends with /incidents
        if (url && !url.endsWith('/incidents')) {
            url = url.endsWith('/') ? url + 'incidents' : url + '/incidents';
        }

        try {
            // Added {mode: 'cors'} and headers to force connection
            const response = await fetch(url, { 
                mode: 'cors',
                headers: { 'Accept': 'application/json' }
            });
            
            if (!response.ok) throw new Error("HTTP Error");
            
            const data = await response.json();
            
            if (data.length === 0) {
                feedRoot.innerHTML = "[ MONITORING FREQUENCIES - NO ACTIVE CALLS ]";
            } else {
                let html = "";
                data.forEach(inc => {
                    let statuses = "";
                    inc.unitStatuses.forEach(s => {
                        let cClass = "enrt-text";
                        if (s.includes("On Scene")) cClass = "scne-text";
                        else if (s.includes("To Hospital")) cClass = "hosp-text";
                        
                        statuses += `<div class="status-row ${cClass}">> ${s}</div>`;
                    });

                    html += `
                        <div class="incident-entry">
                            <span style="float:right; color:var(--timestamp-cyan); font-size:0.7rem;">${inc.time}</span>
                            <div class="inc-agency">[ ${inc.agency} ]</div>
                            <div class="inc-type">${inc.type}</div>
                            <div class="inc-addr">${inc.address}</div>
                            ${statuses}
                        </div>`;
                });
                feedRoot.innerHTML = html;
            }
            syncText.innerText = `SYNCED: ${new Date().toLocaleTimeString()}`;
        } catch (e) {
            syncText.innerText = "BRIDGE OFFLINE";
            feedRoot.innerHTML = `
                <div style="color:red; font-weight:bold;">[ BRIDGE CONNECTION ERROR ]</div>
                <div style="font-size:0.8rem; margin-top:10px; color:#888;">
                    1. Ensure PowerShell is running 'node server.js'<br>
                    2. Verify the Pinggy link ends with <b>/incidents</b><br>
                    3. Check if the bridge URL in the box above matches your terminal.
                </div>`;
        }
    }

    // Refresh every 5 seconds
    setInterval(updateLiveFeed, 5000);
    updateLiveFeed();

    // Clock Logic
    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'}); 
    }, 1000);
</script>
</body>
</html>
