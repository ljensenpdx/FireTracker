<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oregon Fire Ops | Command Dashboard</title>
    <style>
        :root {
            --bg-dark: #080808; --panel-bg: #121212; --fire-red: #cc3333; 
            --directory-yellow: #ffff00; --timestamp-cyan: #00f2ff;
            --btn-light-gray: #3a3a3a; --terminal-green: #00ff00;
        }

        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg-dark); color: #e0e0e0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        header { background: #000; padding: 12px 25px; border-bottom: 3px solid var(--fire-red); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }

        .main-wrapper { display: grid; grid-template-columns: 1fr 320px 450px; gap: 12px; padding: 12px; flex-grow: 1; overflow: hidden; }
        
        /* DIRECTORY & CARDS */
        .column { background: var(--panel-bg); border-radius: 6px; display: flex; flex-direction: column; border: 1px solid #222; overflow: hidden; }
        .scroll-area { padding: 12px; overflow-y: auto; flex-grow: 1; }
        .accordion-header { background: #1a1a1a; padding: 12px; font-weight: 800; border-bottom: 1px solid #000; cursor: pointer; border-left: 8px solid #444; }
        .unit-btn { position: relative; padding: 12px 4px; color: #fff; font-weight: 900; background: var(--btn-light-gray); border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 11px; margin-bottom: 4px; text-align: center; overflow: hidden; }
        .btn-bg { position: absolute; inset: 0; background-repeat: no-repeat; background-position: center; background-size: contain; opacity: 0.25; pointer-events: none; }

        /* TERMINAL PANEL */
        .terminal-panel { display: flex; flex-direction: column; background: #000; border: 1px solid #333; border-radius: 6px; overflow: hidden; height: 100%; }
        .terminal-header { background: #111; padding: 8px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: bold; color: #aaa; }
        #call-notes { background: #000; color: var(--terminal-green); font-family: 'Courier New', monospace; font-size: 1rem; padding: 15px; border: none; width: 100%; height: 35%; resize: none; outline: none; border-bottom: 2px solid #333; }
        
        .live-feed-container { flex-grow: 1; background: #000; padding: 15px; overflow-y: auto; font-family: 'Courier New', monospace; color: var(--terminal-green); }
        .incident-entry { border-left: 2px solid var(--fire-red); padding-left: 10px; margin-bottom: 15px; border-bottom: 1px solid #1a1a1a; padding-bottom: 10px; }
        .inc-agency { color: var(--terminal-green); font-weight: 900; font-size: 0.75rem; }
        
        /* STATUS COLORS */
        .scne-text { color: #ff3333; text-shadow: 0 0 3px #ff3333; }
        .hosp-text { color: #ffff00; text-shadow: 0 0 3px #ffff00; }
        .enrt-text { color: #33ff33; }

        .config-bar { background: #111; padding: 8px; border-top: 1px solid #333; display: flex; gap: 5px; }
        .config-input { flex-grow: 1; background: #000; border: 1px solid #444; color: var(--timestamp-cyan); font-size: 0.7rem; padding: 5px; outline: none; }
        .connect-btn { background: #222; color: #fff; border: 1px solid #444; padding: 2px 10px; font-size: 0.6rem; cursor: pointer; font-weight: bold; border-radius: 3px; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; flex-grow: 1; padding: 10px; }
        .unit-card { position: relative; background: var(--panel-bg); border: 1px solid #333; border-top: 4px solid var(--fire-red); padding: 10px; border-radius: 4px; overflow: hidden; }
        .card-background { position: absolute; inset: 0; opacity: 0.15; background-position: center; background-repeat: no-repeat; background-size: contain; pointer-events: none; }
        .is-hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 1.2rem;">OREGON <span style="color:var(--fire-red)">COMMAND DASHBOARD</span></div>
    <div id="clock" style="font-family: monospace; font-size: 1.4rem; font-weight: 900; color: var(--timestamp-cyan);">00:00:00</div>
</header>

<div class="main-wrapper">
    <div class="column">
        <div class="terminal-header">ACTIVE ASSIGNMENTS</div>
        <div class="dashboard-grid" id="active-units"></div>
    </div>
    
    <div class="column">
        <div style="padding:10px; background:#000;"><input type="text" id="unit-search" class="config-input" style="width:90%" placeholder="SEARCH DIRECTORY..." oninput="filterUnits()"></div>
        <div class="scroll-area" id="accordion-container"></div>
    </div>

    <div class="terminal-panel">
        <div class="terminal-header">COMMAND LOG / NOTES</div>
        <textarea id="call-notes" placeholder="TYPE NOTES..."></textarea>
        
        <div class="terminal-header">LIVE REGIONAL FEED <span id="sync-status">(STANDBY)</span></div>
        <div class="live-feed-container" id="feed-root">
            [ STANDBY ]<br>PASTE PINGGY LINK BELOW AND CLICK CONNECT...
        </div>
        <div class="config-bar">
            <input type="text" id="bridge-url" class="config-input" placeholder="PASTE PINGGY LINK HERE...">
            <button class="connect-btn" onclick="manualConnect()">CONNECT</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz6CvzVCi8CKRrskgLl7IDZVpjl819vft0j5SRzY9AXWsnqmOEU-4TSwujBg5VlOneiyA/exec";
    let feedInterval = null;

    // --- GITHUB GHOST CONNECT ---
    async function updateFeed() {
        let url = document.getElementById('bridge-url').value.trim();
        if (!url) return;
        if (!url.endsWith('/incidents')) url += '/incidents';
        
        // FORCING PROXY FOR GITHUB COMPATIBILITY
        const proxyUrl = "https://corsproxy.io/?url=" + encodeURIComponent(url);
        
        try {
            const res = await fetch(proxyUrl, {
                method: 'GET',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' }
            });
            
            const data = await res.json();
            let html = "";
            data.forEach(inc => {
                let sHtml = "";
                inc.unitStatuses.forEach(s => {
                    let c = s.includes("On Scene") ? "scne-text" : s.includes("To Hospital") ? "hosp-text" : "enrt-text";
                    sHtml += `<div style="margin-left:10px; font-weight:bold;" class="${c}">> ${s}</div>`;
                });
                html += `
                    <div class="incident-entry">
                        <span style="float:right; opacity:0.5; font-size:0.6rem;">${inc.time}</span>
                        <div class="inc-agency">[ ${inc.agency} ]</div>
                        <div style="color:#fff; font-weight:bold;">${inc.type}</div>
                        <div style="color:var(--directory-yellow); font-size:0.7rem;">${inc.address}</div>
                        ${sHtml}
                    </div>`;
            });
            document.getElementById('feed-root').innerHTML = html || "[ NO ACTIVE CALLS ]";
            document.getElementById('sync-status').innerText = "(LIVE: " + new Date().toLocaleTimeString() + ")";
        } catch (e) {
            document.getElementById('sync-status').innerText = "(ERROR)";
            console.error("Connection Refused:", e);
        }
    }

    function manualConnect() {
        if(!document.getElementById('bridge-url').value) return;
        document.getElementById('feed-root').innerHTML = "[ ESTABLISHING HANDSHAKE... ]";
        updateFeed();
        if(!feedInterval) feedInterval = setInterval(updateFeed, 5000);
    }

    // --- DIRECTORY LOGIC ---
    function initDirectory(raw) {
        const container = document.getElementById('accordion-container');
        const rows = Array.isArray(raw) ? raw : (raw.data || []);
        const groups = {};
        rows.slice(1).forEach(row => {
            const cty = (row[1] || "OTHER").toUpperCase();
            if (!groups[cty]) groups[cty] = [];
            groups[cty].push({ name: row[2], station: row[3], logo: row[8] });
        });
        Object.keys(groups).sort().forEach(cty => {
            const h = document.createElement('div'); h.className='accordion-header'; h.innerText=cty;
            const content = document.createElement('div'); content.className='is-hidden';
            groups[cty].forEach(u => {
                const b = document.createElement('button'); b.className='unit-btn';
                const cleanLogo = u.logo ? u.logo.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/") : "";
                b.innerHTML = cleanLogo ? `<div class="btn-bg" style="background-image:url('${cleanLogo}')"></div><span>${u.name}</span>` : `<span>${u.name}</span>`;
                b.onclick = () => {
                    const card = document.createElement('div'); card.className='unit-card';
                    const time = new Date().toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit'});
                    card.innerHTML = `<div class="card-background" style="background-image:url('${cleanLogo}')"></div><div style="font-weight:900;">${u.name}</div><div style="font-size:0.7rem; color:var(--timestamp-cyan);">D: ${time}</div><button onclick="this.parentElement.remove()" style="width:100%; background:var(--fire-red); border:none; color:white; margin-top:5px; cursor:pointer;">CLEAR</button>`;
                    document.getElementById('active-units').prepend(card);
                };
                content.appendChild(b);
            });
            h.onclick = () => content.classList.toggle('is-hidden');
            container.appendChild(h); container.appendChild(content);
        });
    }

    window.onload = () => {
        const s = document.createElement('script'); s.src = `${GOOGLE_URL}?callback=initDirectory&ts=${Date.now()}`;
        document.body.appendChild(s);
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', {hour12:false}); }, 1000);
    };

    function filterUnits() {
        const q = document.getElementById('unit-search').value.toUpperCase();
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.toggle('is-hidden', !b.innerText.toUpperCase().includes(q)));
    }
</script>
</body>
</html>
