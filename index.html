<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oregon Command Dashboard | GAS Build</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #111;
            --red: #ff3b30;
            --green: #00ff41;
            --border: #333;
        }

        body {
            background-color: var(--bg);
            color: #eee;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
            display: grid;
            grid-template-columns: 240px 1fr 380px;
            grid-template-rows: 60px 1fr 350px;
            gap: 12px;
            height: 98vh;
        }

        header { 
            grid-column: 1 / -1; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--red); 
        }

        .panel { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .panel-header { 
            background: #1a1a1a; 
            padding: 8px 12px; 
            font-weight: bold; 
            color: var(--red); 
            border-bottom: 1px solid var(--border); 
            text-transform: uppercase; 
            font-size: 0.8rem; 
        }

        /* --- LEFT SIDEBAR: STATUS BUTTONS --- */
        .sidebar-left { grid-row: 2 / 4; }
        .unit-btn { 
            background: #222; color: #fff; border: 1px solid #444; 
            padding: 12px; margin: 8px; text-align: left; cursor: pointer;
            font-weight: bold; font-size: 0.75rem;
        }

        /* --- CENTER: GOOGLE SHEETS UNIT DATA --- */
        .sheets-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
        }
        .sheet-row { 
            display: grid; 
            grid-template-columns: 80px 1fr 100px; 
            border-bottom: 1px solid #222; 
            padding: 5px 0; 
            font-size: 0.85rem; 
        }

        /* --- LOWER RIGHT: GROUPED REGIONAL FEED --- */
        #regional-feed { grid-column: 3; grid-row: 3; }
        .feed-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 12px; 
            background: #000; 
            font-family: 'Consolas', monospace; 
        }

        .incident { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .inc-header { color: var(--red); font-weight: bold; font-size: 0.9rem; }
        .inc-addr { color: #fff; font-size: 0.85rem; margin: 2px 0; }
        .unit-group { margin-top: 5px; line-height: 1.4; }
        .unit-ids { color: var(--green); font-weight: bold; font-size: 0.85rem; }
        .status-text { color: #777; font-size: 0.75rem; margin-left: 5px; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size: 1.6rem;">OREGON <span style="color:var(--red)">COMMAND</span></h1>
        <div id="clock" style="color:var(--green); font-family:monospace; font-size:1.2rem;">--:--:-- PST</div>
    </header>

    <div class="panel sidebar-left">
        <div class="panel-header">Unit Status Selectors</div>
        <button class="unit-btn">TONED OUT</button>
        <button class="unit-btn">EN ROUTE</button>
        <button class="unit-btn">ON SCENE</button>
        <button class="unit-btn">TO HOSPITAL</button>
        <button class="unit-btn">AT HOSPITAL</button>
        <button class="unit-btn">CLEARED</button>
    </div>

    <div class="panel" style="grid-column: 2; grid-row: 2/4;">
        <div class="panel-header">Current Unit Assignments (Google Sheets)</div>
        <div class="sheets-container" id="sheets-list">
            <div style="color: #666;">Waiting for GAS Uplink...</div>
        </div>
    </div>

    <div class="panel" style="grid-column: 3; grid-row: 2;">
        <div class="panel-header">Agency Selectors</div>
        <div style="padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
            <button class="unit-btn" style="margin:2px;">CLACKAMAS</button>
            <button class="unit-btn" style="margin:2px;">MULTNOMAH</button>
            <button class="unit-btn" style="margin:2px;">MARION</button>
            <button class="unit-btn" style="margin:2px;">WASHINGTON</button>
        </div>
    </div>

    <div class="panel" id="regional-feed">
        <div class="panel-header">Live Regional Feed</div>
        <div class="feed-scroll" id="live-feed">
            <div style="color:var(--green)">SYNCING...</div>
        </div>
    </div>

    <script>
        // 🚨 YOUR GOOGLE APPS SCRIPT WEB APP URL
        const GAS_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

        // 1. Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString() + ' PST';
        }, 1000);

        // 2. Main Fetch Logic (Calls GAS for both Sheets & PulsePoint)
        async function updateDashboard() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();

                // UPDATE GOOGLE SHEETS SECTION
                if (data.sheets) {
                    const sheetsContainer = document.getElementById('sheets-list');
                    sheetsContainer.innerHTML = data.sheets.map(row => `
                        <div class="sheet-row">
                            <span style="color:var(--green); font-weight:bold;">${row.unitId}</span>
                            <span>${row.personnel}</span>
                            <span style="color:#aaa;">${row.assignment}</span>
                        </div>
                    `).join('');
                }

                // UPDATE PULSEPOINT FEED (Grouped)
                if (data.incidents) {
                    const feedContainer = document.getElementById('live-feed');
                    feedContainer.innerHTML = data.incidents.map(inc => {
                        const groups = {};
                        inc.unitStatuses.forEach(u => {
                            const match = u.match(/(.+) \((.+)\)/);
                            if (match) {
                                const [_, id, status] = match;
                                if (!groups[status]) groups[status] = [];
                                groups[status].push(id);
                            }
                        });

                        const statusRows = Object.keys(groups).map(s => `
                            <div class="unit-group">
                                <span class="unit-ids">${groups[s].join(', ')}</span>
                                <span class="status-text">(${s})</span>
                            </div>
                        `).join('');

                        return `
                            <div class="incident">
                                <div class="inc-header">${inc.type}</div>
                                <div class="inc-addr">${inc.address}</div>
                                ${statusRows}
                                <div style="color:#444; font-size:10px; margin-top:4px;">${inc.agency} • ${inc.time}</div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error("GAS Sync Error:", err);
            }
        }

        // Auto-refresh every 30 seconds
        setInterval(updateDashboard, 30000);
        updateDashboard();
    </script>
</body>
</html>
