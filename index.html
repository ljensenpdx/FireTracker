<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oregon Command | Multi-Agency Console</title>
    <style>
        :root {
            --bg: #080808; --panel: #121212; --red: #cc3333; 
            --yellow: #ffff00; --cyan: #00f2ff; --green: #00ff00;
        }

        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #000; padding: 12px 25px; border-bottom: 3px solid var(--red); display: flex; justify-content: space-between; align-items: center; }
        .main-wrapper { display: grid; grid-template-columns: 1fr 320px 450px; gap: 12px; padding: 12px; flex-grow: 1; overflow: hidden; }
        
        .column { background: var(--panel); border-radius: 6px; border: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; }
        .scroll-area { padding: 12px; overflow-y: auto; flex-grow: 1; }

        /* UNIT CARDS (Left) */
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 5px; }
        .unit-card { position: relative; background: #1a1a1a; border-top: 4px solid var(--red); padding: 10px; border-radius: 4px; overflow: hidden; min-height: 140px; }
        .card-bg { position: absolute; inset: 0; opacity: 0.18; background-position: center; background-repeat: no-repeat; background-size: contain; pointer-events: none; }
        .card-content { position: relative; z-index: 5; }
        .ts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 8px; font-size: 0.65rem; font-family: monospace; color: var(--cyan); }

        /* DIRECTORY (Middle) */
        .accordion-header { background: #1a1a1a; padding: 12px; font-weight: bold; border-bottom: 1px solid #000; cursor: pointer; border-left: 5px solid #444; }
        .unit-btn { width: 100%; padding: 10px; background: #333; color: #fff; border: 1px solid #444; margin-bottom: 2px; cursor: pointer; position: relative; overflow: hidden; text-align: left; }
        .btn-bg { position: absolute; inset: 0; opacity: 0.2; background-size: contain; background-repeat: no-repeat; background-position: center; pointer-events: none; }

        /* 📟 TERMINAL (Lower Right) */
        .terminal-panel { display: flex; flex-direction: column; background: #000; border: 1px solid #333; height: 100%; border-radius: 6px; overflow: hidden; }
        #call-notes { height: 35%; background: #000; color: var(--green); border: none; padding: 15px; font-family: monospace; outline: none; border-bottom: 2px solid #333; resize: none; }
        
        /* Green Computer Font Styling */
        .live-feed-container { flex-grow: 1; overflow-y: auto; padding: 15px; font-family: 'Courier New', monospace; background: #000; }
        .incident-entry { border-left: 2px solid var(--red); padding-left: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #111; }
        
        .unit-group-row { margin-top: 4px; font-size: 0.75rem; line-height: 1.2; }
        .unit-ids { color: var(--green); font-weight: bold; }
        .status-label { color: #888; margin-left: 4px; font-style: italic; }

        .config-bar { background: #111; padding: 8px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .is-hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 1.2rem;">OREGON <span style="color:var(--red)">COMMAND DASHBOARD</span></div>
    <div id="clock" style="font-family: monospace; font-size: 1.4rem; font-weight: 900; color: var(--cyan);">00:00:00</div>
</header>

<div class="main-wrapper">
    <div class="column">
        <div style="background:#111; padding:8px; font-size:0.7rem; color:#888;">UNIT ASSIGNMENTS</div>
        <div class="dashboard-grid scroll-area" id="active-units"></div>
    </div>
    
    <div class="column">
        <div style="padding:10px; background:#000;">
            <input type="text" id="unit-search" style="width:100%; background:#000; border:1px solid #444; color:var(--cyan); padding:6px; font-size:0.75rem;" placeholder="SEARCH DIRECTORY..." oninput="filterUnits()">
        </div>
        <div class="scroll-area" id="accordion-container"></div>
    </div>

    <div class="terminal-panel">
        <textarea id="call-notes" placeholder="TYPE COMMAND NOTES..."></textarea>
        <div style="background:#111; padding:5px 15px; font-size:0.7rem; color:#888; border-bottom:1px solid #333;">LIVE REGIONAL FEED <span id="sync-status">(STANDBY)</span></div>
        <div class="live-feed-container" id="feed-root">[ INITIALIZING UPLINK... ]</div>
        <div class="config-bar">
            <span style="font-size: 0.65rem; color: #555; margin-left: 10px;">SOURCE: DATA.JSON</span>
            <div id="connection-dot" style="width:8px; height:8px; background:var(--green); border-radius:50%; margin-right:15px; box-shadow: 0 0 5px var(--green);"></div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz6CvzVCi8CKRrskgLl7IDZVpjl819vft0j5SRzY9AXWsnqmOEU-4TSwujBg5VlOneiyA/exec";

    // --- 📡 DATA.JSON FEED LOGIC ---
    async function updateFeed() {
        try {
            const res = await fetch('data.json?t=' + Date.now()); // Prevent caching
            const data = await res.json();
            let html = "";
            
            data.forEach(inc => {
                // Group units by status
                const groups = {};
                inc.unitStatuses.forEach(u => {
                    const match = u.match(/(.+) \((.+)\)/);
                    if (match) {
                        const [_, id, status] = match;
                        if (!groups[status]) groups[status] = [];
                        groups[status].push(id);
                    }
                });

                let sHtml = "";
                Object.keys(groups).forEach(status => {
                    sHtml += `<div class="unit-group-row">> <span class="unit-ids">${groups[status].join(', ')}</span> <span class="status-label">(${status})</span></div>`;
                });

html += `
    <div class="incident-entry">
        <span style="float:right; opacity:0.5; font-size:0.6rem;">${inc.time}</span>
        <div style="color:var(--green); font-weight:900; font-size:0.75rem;">[ ${inc.agency} ]</div>
        
        <div style="color:#fff; font-weight:900; font-size:0.85rem; text-transform:uppercase;">${inc.type}</div>
        
        <div style="color:var(--yellow); font-size:0.75rem;">${inc.address}</div>
        ${sHtml}
    </div>`;
            });
            document.getElementById('feed-root').innerHTML = html || "[ MONITORING... ]";
            document.getElementById('sync-status').innerText = "(LIVE: " + new Date().toLocaleTimeString() + ")";
        } catch (e) { 
            document.getElementById('sync-status').innerText = "(OFFLINE)";
            document.getElementById('connection-dot').style.background = "var(--red)";
        }
    }

    // Previous Directory and Clock Logic Preserved
    function initDirectory(raw) {
        const rows = Array.isArray(raw) ? raw : (raw.data || []);
        const groups = {};
        rows.slice(1).forEach(row => {
            const cty = (row[1] || "OTHER").toUpperCase();
            if (!groups[cty]) groups[cty] = [];
            groups[cty].push({ name: row[2], station: row[3], logo: row[8] });
        });
        const container = document.getElementById('accordion-container');
        Object.keys(groups).sort().forEach(cty => {
            const h = document.createElement('div'); h.className='accordion-header'; h.innerText=cty;
            const content = document.createElement('div'); content.className='is-hidden';
            groups[cty].forEach(u => {
                const b = document.createElement('button'); b.className='unit-btn';
                const cleanLogo = u.logo ? u.logo.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/") : "";
                b.innerHTML = `<div class="btn-bg" style="background-image:url('${cleanLogo}')"></div><span style="position:relative; z-index:2;">${u.name}</span>`;
                b.onclick = () => {
                    const card = document.createElement('div'); card.className = 'unit-card';
                    const time = new Date().toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit'});
                    card.innerHTML = `<div class="card-bg" style="background-image:url('${cleanLogo}')"></div><div class="card-content"><div style="font-weight:900;">${u.name}</div><div style="font-size:0.6rem; color:var(--yellow);">${u.station}</div><div class="ts-grid"><span>D: ${time}</span><span>E: --:--</span><span>S: --:--</span></div><button onclick="this.parentElement.parentElement.remove()" style="width:100%; margin-top:8px; background:var(--red); color:#fff; border:none; cursor:pointer; font-size:0.6rem; padding:4px;">CLEAR</button></div>`;
                    document.getElementById('active-units').prepend(card);
                };
                content.appendChild(b);
            });
            h.onclick = () => content.classList.toggle('is-hidden');
            container.appendChild(h); container.appendChild(content);
        });
    }

    window.onload = () => {
        const s = document.createElement('script'); s.src = `${GOOGLE_URL}?callback=initDirectory&ts=${Date.now()}`;
        document.body.appendChild(s);
        
        // Start Loops
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', {hour12:false}); }, 1000);
        setInterval(updateFeed, 10000); // Pulse check every 10 seconds
        updateFeed();
    };

    function filterUnits() {
        const q = document.getElementById('unit-search').value.toUpperCase();
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.toggle('is-hidden', !b.innerText.toUpperCase().includes(q)));
    }
</script>
</body>
</html>
