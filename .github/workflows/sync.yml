name: PulsePoint Sync
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚡ CACHING: This saves the browser so it doesn't download every 5 minutes
      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Puppeteer Browser
        uses: actions/cache@v3
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package.json') }}

      # 🕵️ INSTALL STEALTH TOOLS: Required for Option A
      - name: Install Dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth axios

      # 📟 RUN THE BRIDGE: Executes your scraper logic
      - name: Run Bridge
        run: node bridge.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # Ensure this secret is in your repo settings
