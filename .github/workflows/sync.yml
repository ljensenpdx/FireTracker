name: PulsePoint 90s Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # ⚡ SPEED FIX: Updated key "v2" forces a clean, fast cache reset
      - name: Cache dependencies
        id: cache-npm
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Install Dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: |
          npm install axios puppeteer-extra puppeteer-extra-plugin-stealth puppeteer-core lru-cache

      - name: 90 Second Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for i in {1..16}
          do
            echo "--- Cycle $i ---"
            node bridge.js
            echo "Sleeping 90s..."
            sleep 90
          done
