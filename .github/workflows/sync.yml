name: PulsePoint 90s Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ⚡ CACHE STEP: This skips the long install phase on repeat runs
      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-v1-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install axios puppeteer-extra puppeteer-extra-plugin-stealth puppeteer lru-cache

      # This ensures Chrome is ready without a full re-download
      - name: Initialize Puppeteer
        run: npx puppeteer install

      - name: 90 Second Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for i in {1..16}
          do
            echo "--- Cycle $i ---"
            node bridge.js
            echo "Sleeping 90s..."
            sleep 90
          done
