name: PulsePoint Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚡ This prevents the "Lock up" by using the pre-installed browser on the runner
      - name: Install Latest Dependencies
        run: |
          npm install puppeteer@latest puppeteer-extra@latest puppeteer-extra-plugin-stealth@latest axios
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true' 

      - name: Run Bridge
        run: node bridge.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
