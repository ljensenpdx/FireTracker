name: PulsePoint 90s Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install axios puppeteer-extra puppeteer-extra-plugin-stealth puppeteer lru-cache
          npx puppeteer install

      - name: 90 Second Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for i in {1..16}
          do
            echo "Cycle $i starting..."
            node bridge.js
            echo "Waiting 90 seconds..."
            sleep 90
          done
