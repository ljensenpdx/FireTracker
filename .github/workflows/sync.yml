name: PulsePoint Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Puppeteer Browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package.json') }}

      - name: Install Dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth axios

      - name: Run Bridge
        run: node bridge.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # FIXED: Upload debug artifacts with v4
      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-screenshot.png
          retention-days: 5
          if-no-files-found: warn

      - name: Upload Error Page (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-page
          path: error-page.html
          retention-days: 5
          if-no-files-found: ignore
