name: PulsePoint 90s Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Backup trigger every 30 mins

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install axios puppeteer-extra puppeteer-extra-plugin-stealth puppeteer
          # Force Chrome install to prevent hanging
          npx puppeteer install

      - name: 90 Second Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # This loop runs for 25 minutes (about 15-16 cycles)
          # then finishes so the next scheduled job can take over.
          for i in {1..150}
          do
            echo "Cycle $i starting..."
            node bridge.js
            echo "Waiting 90 seconds..."
            sleep 90
          done
