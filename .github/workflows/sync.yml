name: PulsePoint 90s Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer # Force cache to local workspace
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install axios puppeteer-extra puppeteer-extra-plugin-stealth puppeteer lru-cache
          # Manually install the browser into the forced local cache
          npx puppeteer browsers install chrome

      - name: 90 Second Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for i in {1..16}
          do
            echo "--- Cycle $i ---"
            node bridge.js
            echo "Sleeping 90s..."
            sleep 90
          done
