name: PulsePoint 90s Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # Starts the loop every 10 mins

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install axios puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: 90 Second Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Run 3 times (Total ~5 mins) to stay within Action limits
          for i in {1..3}
          do
            echo "Cycle $i starting..."
            node bridge.js
            echo "Waiting 90 seconds..."
            sleep 90
          done
