name: PulsePoint 90s Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Fast Dependency Install
        run: |
          # Skip Chromium download to prevent hangs
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install axios puppeteer-extra puppeteer-extra-plugin-stealth puppeteer lru-cache

      - name: 90 Second Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          for i in {1..16}
          do
            echo "--- Cycle $i ---"
            node bridge.js
            echo "Sleeping 90s..."
            sleep 90
          done
